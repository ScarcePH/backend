name: Deploy to Cloud Run (Docker)

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: backend
  REGION: ${{ secrets.REGION }}
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  IMAGE: ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/scarce/backend:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run unit tests
      run: python -m unittest discover -s tests -v

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        echo "REGION=$REGION"
        gcloud auth configure-docker "$REGION-docker.pkg.dev"

    - name: Build Docker image
      run: |
        echo "Building image: $IMAGE"
        docker build -t "$IMAGE" .

    - name: Push Docker image
      run: |
        echo "Pushing image: $IMAGE"
        docker push "$IMAGE"

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        echo "REGION=$REGION"
        gcloud auth configure-docker "$REGION-docker.pkg.dev"

    - name: Pull Docker image
      run: |
        echo "Pulling image: $IMAGE"
        docker pull "$IMAGE"

    - name: Run migrations
      run: |
        docker run --rm \
          -e DB_URI="${{ secrets.DB_URI }}" \
          "$IMAGE" \
          alembic upgrade head

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy "$SERVICE_NAME" \
          --image "$IMAGE" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --quiet

    - name: Assert deployed image
      run: |
        DEPLOYED_IMAGE=$(gcloud run services describe "$SERVICE_NAME" \
          --region "$REGION" \
          --format="value(spec.template.spec.containers[0].image)")

        echo "Expected: $IMAGE"
        echo "Deployed: $DEPLOYED_IMAGE"

        if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
          echo "❌ Image mismatch"
          exit 1
        fi

        echo "✅ Correct image deployed"
